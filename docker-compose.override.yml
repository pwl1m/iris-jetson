services:
  iris-mosquitto:
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  iris-app:
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/zoneinfo/America/Sao_Paulo:/usr/share/zoneinfo/America/Sao_Paulo:ro
