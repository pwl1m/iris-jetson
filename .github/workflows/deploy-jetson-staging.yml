name: Deploy Jetson Staging

on:
  push:
    branches:
      - deploy/staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy repository to Jetson
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.JETSON_HOST }}
          username: ${{ secrets.JETSON_USER }}
          key: ${{ secrets.JETSON_SSH_KEY }}
          port: ${{ secrets.JETSON_PORT || '22' }}
          source: ".github,AGENTS.md,README.md,.env.example,.gitignore,docker-compose.yml,iris-app,iris-go2rtc,iris-mosquitto,runtime-libs,scripts"
          target: ${{ secrets.JETSON_DEPLOY_PATH || '~/iris-jetson' }}

      - name: Deploy on Jetson
        uses: appleboy/ssh-action@v1.0.3
        env:
          JETSON_DEPLOY_PATH: ${{ secrets.JETSON_DEPLOY_PATH || '~/iris-jetson' }}
          JETSON_HEALTH_URL: ${{ secrets.JETSON_HEALTH_URL || 'http://localhost:8081/health' }}
        with:
          host: ${{ secrets.JETSON_HOST }}
          username: ${{ secrets.JETSON_USER }}
          key: ${{ secrets.JETSON_SSH_KEY }}
          port: ${{ secrets.JETSON_PORT || '22' }}
          envs: JETSON_DEPLOY_PATH,JETSON_HEALTH_URL
          script: |
            set -e
            chmod +x "${JETSON_DEPLOY_PATH}/scripts/remote_deploy.sh"
            "${JETSON_DEPLOY_PATH}/scripts/remote_deploy.sh"
