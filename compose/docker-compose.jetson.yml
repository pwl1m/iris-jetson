services:
  mosquitto:
    image: eclipse-mosquitto@sha256:914f529386804c8278a4e581526b9be5e1604df44b30daabc70aa97dcefe5268
    container_name: vision-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mosquitto/data:/mosquitto/data
    networks:
      - vision-lab

  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: vision-go2rtc
    restart: unless-stopped
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555"
    env_file:
      - ../.env
    volumes:
      - ../go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    devices:
      - "${USB_CAMERA_DEVICE:-/dev/video0}:${USB_CAMERA_DEVICE:-/dev/video0}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1984/api/streams"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - vision-lab

  vision-app:
    build:
      context: ../vision-app
      dockerfile: Dockerfile.jetson
    container_name: vision-app
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8081:8080"
    env_file:
      - ../.env
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      FACE_MODEL_NAME: ${FACE_MODEL_NAME:-buffalo_s}
      FACE_DET_SIZE: ${FACE_DET_SIZE:-320,320}
      FACE_PROVIDERS: ${FACE_PROVIDERS:-CUDAExecutionProvider,CPUExecutionProvider}
      FACE_CTX_ID: ${FACE_CTX_ID:--1}
      LD_LIBRARY_PATH: /opt/jetson-libs/cuda:/opt/jetson-libs/system
      STREAM_URL: ${STREAM_URL:-rtsp://go2rtc:8554/usb_camera}
      STREAM_WORKER_ENABLED: ${STREAM_WORKER_ENABLED:-true}
      STREAM_CAPTURE_INTERVAL_SECONDS: ${STREAM_CAPTURE_INTERVAL_SECONDS:-1.0}
      STREAM_RECONNECT_DELAY_SECONDS: ${STREAM_RECONNECT_DELAY_SECONDS:-3.0}
      STREAM_JPEG_QUALITY: ${STREAM_JPEG_QUALITY:-85}
      STREAM_MIN_FACE_SCORE: ${STREAM_MIN_FACE_SCORE:-0.5}
      STREAM_MAX_CAPTURE_FILES: ${STREAM_MAX_CAPTURE_FILES:-2000}
      STREAM_PREVIEW_UPDATE_INTERVAL_SECONDS: ${STREAM_PREVIEW_UPDATE_INTERVAL_SECONDS:-0.25}
      STREAM_PREVIEW_MAX_WIDTH: ${STREAM_PREVIEW_MAX_WIDTH:-640}
      STREAM_PREVIEW_JPEG_QUALITY: ${STREAM_PREVIEW_JPEG_QUALITY:-70}
      STREAM_READER_BUFFER_SIZE: ${STREAM_READER_BUFFER_SIZE:-1}
      STREAM_SOURCE_READY_TIMEOUT_SECONDS: ${STREAM_SOURCE_READY_TIMEOUT_SECONDS:-20}
      STREAM_SOURCE_PROBE_URL: ${STREAM_SOURCE_PROBE_URL:-http://go2rtc:1984/api/streams}
    volumes:
      - ../vision-app/data-faces:/data/faces
      - ../vision-app/data-events:/data/events
      - ../vision-app/models:/models/face
      - ../vision-app/samples:/samples
      - /usr/local/cuda/targets/aarch64-linux/lib:/opt/jetson-libs/cuda:ro
      - ../runtime-libs:/opt/jetson-libs/system:ro
    depends_on:
      go2rtc:
        condition: service_healthy
    networks:
      - vision-lab

networks:
  vision-lab:
    name: vision-lab
    driver: bridge
